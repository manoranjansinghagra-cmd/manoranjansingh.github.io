<html lang="en">
<head>

<title>Manoranjan Singh | Power Transmission Professional</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#07111f;
    color:#eaf2ff;
    line-height:1.6;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,17,31,0.95);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.navbar{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
    color:#f5c76b;
    letter-spacing:0.5px;
}

.nav-links{
    display:flex;
    gap:25px;
    list-style:none;
}

.nav-links a{
    color:#cbd7e8;
    font-size:14px;
    font-weight:600;
    transition:0.3s;
}

.nav-links a:hover{
    color:#f5c76b;
}

/* =========================
   HERO
========================= */

.hero{
    padding:90px 0 70px;
    background:
    radial-gradient(circle at 10% 20%, rgba(0,190,255,0.12), transparent 35%),
    radial-gradient(circle at 90% 20%, rgba(245,199,107,0.12), transparent 35%),
    #07111f;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.3fr 0.7fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border:1px solid rgba(245,199,107,0.4);
    border-radius:30px;
    color:#f5c76b;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(42px,6vw,76px);
    line-height:1.02;
    margin-bottom:25px;
    letter-spacing:-2px;
}

.hero h1 span{
    color:#f5c76b;
}

.hero-subtitle{
    font-size:20px;
    color:#aebed2;
    max-width:750px;
    margin-bottom:30px;
}

.hero-buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:13px 22px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.18);
    background:#101f33;
    color:#fff;
    font-weight:700;
    font-size:14px;
    transition:0.3s;
    cursor:pointer;
}

.btn:hover{
    transform:translateY(-2px);
    border-color:#f5c76b;
}

.btn.primary{
    background:#f5c76b;
    color:#07111f;
    border-color:#f5c76b;
}

.btn.whatsapp{
    background:#168b52;
    border-color:#168b52;
    color:white;
}

.btn.whatsapp:hover{
    background:#20a864;
}

/* =========================
   PROFILE PHOTO
========================= */

.profile-card{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,0.08),
        rgba(255,255,255,0.025)
    );

    border:1px solid rgba(255,255,255,0.12);
    border-radius:22px;
    padding:22px;
    text-align:center;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
}

.profile-card img{
    width:100%;
    max-width:330px;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:18px;
    border:3px solid rgba(245,199,107,0.7);
}

.profile-name{
    font-size:24px;
    font-weight:800;
    margin-top:18px;
}

.profile-role{
    color:#9fb0c5;
    margin-top:5px;
    font-size:14px;
}

/* =========================
   METRICS
========================= */

.metrics-section{
    padding:35px 0;
    border-top:1px solid rgba(255,255,255,0.06);
    border-bottom:1px solid rgba(255,255,255,0.06);
    background:#091727;
}

.metrics{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.metric{
    padding:25px 15px;
    text-align:center;
    border-right:1px solid rgba(255,255,255,0.08);
}

.metric:last-child{
    border-right:none;
}

.metric-number{
    color:#f5c76b;
    font-size:34px;
    font-weight:900;
    line-height:1.2;
}

.metric-label{
    margin-top:7px;
    color:#9fb0c5;
    font-size:13px;
}

/* =========================
   SECTIONS
========================= */

section{
    padding:90px 0;
}

.section-heading{
    margin-bottom:45px;
}

.section-kicker{
    color:#f5c76b;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:10px;
}

.section-heading h2{
    font-size:42px;
    line-height:1.15;
}

.section-heading p{
    color:#9fb0c5;
    max-width:800px;
    margin-top:14px;
}

/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
}

.about-text{
    color:#b7c6d8;
    font-size:16px;
}

.about-text p{
    margin-bottom:18px;
}

.highlight-box{
    background:#0c1a2c;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:25px;
}

.highlight-box h3{
    color:#f5c76b;
    margin-bottom:15px;
}

.highlight-list{
    list-style:none;
}

.highlight-list li{
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    color:#b7c6d8;
}

.highlight-list li:last-child{
    border-bottom:none;
}

/* =========================
   PROJECTS
========================= */

.projects{
    background:#091727;
}

.project-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.project-card{
    background:#0c1a2c;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:28px;
    transition:0.3s;
}

.project-card:hover{
    transform:translateY(-5px);
    border-color:rgba(245,199,107,0.5);
    box-shadow:0 18px 45px rgba(0,0,0,0.25);
}

.project-tag{
    display:inline-block;
    color:#07111f;
    background:#f5c76b;
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:800;
    margin-bottom:15px;
}

.project-card h3{
    font-size:22px;
    margin-bottom:10px;
}

.project-card p{
    color:#9fb0c5;
    font-size:14px;
}

.project-company{
    margin-top:18px;
    color:#d8e3f0;
    font-size:13px;
    font-weight:700;
}

/* =========================
   CAREER
========================= */

.timeline{
    position:relative;
    margin-top:30px;
}

.timeline:before{
    content:"";
    position:absolute;
    left:13px;
    top:0;
    bottom:0;
    width:2px;
    background:rgba(245,199,107,0.35);
}

.timeline-item{
    position:relative;
    padding-left:50px;
    margin-bottom:35px;
}

.timeline-dot{
    position:absolute;
    left:6px;
    top:5px;
    width:16px;
    height:16px;
    background:#f5c76b;
    border-radius:50%;
    box-shadow:0 0 0 5px rgba(245,199,107,0.1);
}

.timeline-year{
    color:#f5c76b;
    font-size:13px;
    font-weight:800;
    margin-bottom:5px;
}

.timeline-item h3{
    font-size:21px;
}

.timeline-item p{
    color:#9fb0c5;
    margin-top:5px;
}

/* =========================
   EXPERTISE
========================= */

.expertise{
    background:#091727;
}

.expertise-grid{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.skill{
    padding:12px 16px;
    border-radius:30px;
    background:#101f
