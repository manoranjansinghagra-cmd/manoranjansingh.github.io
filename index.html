<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manoranjan Singh | Power Transmission Project Leader</title>

<meta name="description" content="Manoranjan Singh – Power Transmission Project Leader with 28+ years of experience in EPC, TBCB, 765 kV, 400 kV, 220 kV, 132 kV and ±800 kV HVDC transmission projects.">

<meta name="keywords" content="Manoranjan Singh, Power Transmission, AGM Projects, Chief Project Manager, TBCB, EPC, 765 kV, HVDC, Transmission Line, Project Management">

<meta name="author" content="Manoranjan Singh">

<meta property="og:title" content="Manoranjan Singh | Power Transmission Project Leader">
<meta property="og:description" content="28+ years of power transmission project leadership experience across EPC, TBCB, 765 kV and HVDC projects.">
<meta property="og:type" content="website">

<meta name="theme-color" content="#07111f">

<style>

:root{
    --bg:#06101d;
    --bg2:#091726;
    --surface:#0c1b2c;
    --surface2:#10243a;
    --text:#edf5ff;
    --muted:#9db0c5;
    --gold:#e4b65d;
    --gold2:#ffdc8a;
    --blue:#36a8ff;
    --cyan:#55ddff;
    --green:#35d58a;
    --red:#ff6675;
    --line:rgba(255,255,255,.09);
    --shadow:0 25px 70px rgba(0,0,0,.30);
}

body.light{
    --bg:#f4f7fb;
    --bg2:#ffffff;
    --surface:#ffffff;
    --surface2:#edf3f9;
    --text:#102033;
    --muted:#5a6c80;
    --line:rgba(16,32,51,.10);
    --shadow:0 20px 55px rgba(20,40,70,.13);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 5%,rgba(54,168,255,.10),transparent 25%),
        radial-gradient(circle at 95% 15%,rgba(228,182,93,.09),transparent 25%),
        var(--bg);
    color:var(--text);
    line-height:1.65;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:105px 0;
    position:relative;
}

.eyebrow{
    color:var(--gold);
    font-size:11px;
    font-weight:850;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:13px;
}

.section-head{
    margin-bottom:45px;
}

.section-title{
    font-size:clamp(32px,4vw,50px);
    line-height:1.08;
    letter-spacing:-1.8px;
    margin-bottom:15px;
}

.section-text{
    max-width:780px;
    color:var(--muted);
}

/* ================= HEADER ================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(6,16,29,.74);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
    animation:navDrop .8s ease both;
}

body.light header{
    background:rgba(255,255,255,.86);
}

.nav{
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--gold);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:24px;
}

.nav-links a{
    color:var(--muted);
    font-size:12px;
    font-weight:650;
    position:relative;
    transition:.3s;
}

.nav-links a:after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:0;
    height:2px;
    background:var(--gold);
    transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
    color:var(--text);
}

.nav-links a:hover:after,
.nav-links a.active:after{
    width:100%;
}

.nav-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    cursor:pointer;
    transition:.3s;
}

.icon-btn:hover{
    transform:translateY(-3px);
    border-color:var(--gold);
}

.menu-btn{
    display:none;
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;
    padding-top:145px;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.hero:before{
    content:"";
    position:absolute;
    width:720px;
    height:720px;
    left:-350px;
    top:-300px;
    background:radial-gradient(circle,rgba(54,168,255,.15),transparent 68%);
    animation:orb 9s ease-in-out infinite alternate;
}

.hero:after{
    content:"";
    position:absolute;
    width:650px;
    height:650px;
    right:-330px;
    bottom:-300px;
    background:radial-gradient(circle,rgba(228,182,93,.11),transparent 68%);
    animation:orb 11s ease-in-out infinite alternate-reverse;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:70px;
    align-items:center;
    position:relative;
    z-index:2;
}

.kicker{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 14px;
    border-radius:40px;
    color:var(--gold2);
    background:rgba(228,182,93,.08);
    border:1px solid rgba(228,182,93,.25);
    font-size:10px;
    font-weight:850;
    letter-spacing:1.7px;
    margin-bottom:20px;
    animation:fadeUp .8s .1s both;
}

.kicker:before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 6px rgba(53,213,138,.09);
}

.hero h1{
    font-size:clamp(51px,7vw,86px);
    line-height:.94;
    letter-spacing:-4px;
    margin-bottom:20px;
    animation:fadeUp .8s .2s both;
}

.hero h1 span{
    color:var(--gold);
}

.hero-role{
    font-size:19px;
    line-height:1.5;
    color:var(--cyan);
    font-weight:780;
    max-width:760px;
    margin-bottom:20px;
    animation:fadeUp .8s .3s both;
}

.hero-copy{
    color:var(--muted);
    max-width:730px;
    font-size:15px;
    margin-bottom:28px;
    animation:fadeUp .8s .4s both;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    animation:fadeUp .8s .5s both;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 19px;
    border-radius:8px;
    font-size:12px;
    font-weight:850;
    border:1px solid transparent;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:.3s;
}

.btn:before{
    content:"";
    position:absolute;
    width:80%;
    height:100%;
    top:0;
    left:-130%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    transform:skewX(-20deg);
    transition:.7s;
}

.btn:hover:before{
    left:150%;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-primary{
    background:linear-gradient(135deg,var(--gold),var(--gold2));
    color:#111;
    box-shadow:0 12px 32px rgba(228,182,93,.20);
}

.btn-outline{
    background:rgba(255,255,255,.025);
    color:var(--text);
    border-color:var(--line);
}

.btn-outline:hover{
    border-color:var(--gold);
    background:rgba(228,182,93,.07);
}

/* HERO PROFILE */

.profile-side{
    display:flex;
    justify-content:center;
    position:relative;
    animation:profileIn 1s .35s both;
}

.profile-card{
    width:min(390px,100%);
    padding:15px;
    border-radius:25px;
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.015));
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    position:relative;
}

.profile-card:before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:25px;
    border:1px solid rgba(228,182,93,.23);
    opacity:.6;
}

.profile-image{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    border-radius:18px;
    display:block;
    position:relative;
    z-index:2;
    transition:.6s;
}

.profile-card:hover .profile-image{
    transform:scale(1.025);
}

.profile-caption{
    position:absolute;
    left:30px;
    right:30px;
    bottom:30px;
    padding:14px 16px;
    border-radius:12px;
    background:rgba(4,12,22,.78);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.10);
    z-index:3;
}

.profile-caption strong{
    display:block;
    font-size:14px;
}

.profile-caption small{
    color:#a9bbd0;
}

/* ================= KPI ================= */

.kpi-grid{
    margin-top:65px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    position:relative;
    z-index:5;
}

.kpi{
    padding:23px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.025);
    border-radius:15px;
    transition:.35s;
}

.kpi:hover{
    transform:translateY(-7px);
    border-color:rgba(228,182,93,.35);
    box-shadow:0 20px 45px rgba(0,0,0,.18);
}

.kpi-number{
    color:var(--gold);
    font-size:29px;
    font-weight:950;
    margin-bottom:4px;
}

.kpi-label{
    color:var(--muted);
    font-size:11px;
}

/* ================= TRUST ================= */

.trust-strip{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:19px 0;
    background:rgba(255,255,255,.018);
}

.trust-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

.trust-pill{
    padding:7px 14px;
    border:1px solid var(--line);
    border-radius:30px;
    color:var(--muted);
    font-size:10px;
    font-weight:750;
}

/* ================= CARDS ================= */

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:21px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:19px;
}

.card{
    background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
    transition:.35s;
}

body.light .card{
    background:#fff;
}

.card:hover{
    transform:translateY(-7px);
    border-color:rgba(228,182,93,.32);
    box-shadow:var(--shadow);
}

.card h3{
    font-size:20px;
    margin-bottom:10px;
}

.card p{
    color:var(--muted);
    font-size:14px;
}

/* ================= EXECUTIVE PROFILE ================= */

.profile-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.about-list{
    display:grid;
    gap:12px;
    margin-top:20px;
}

.about-list div{
    display:flex;
    gap:10px;
    color:var(--muted);
}

.check{
    color:var(--gold);
    font-weight:900;
}

/* ================= CAREER AT A GLANCE ================= */

.glance{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.glance-item{
    padding:22px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--surface);
    transition:.3s;
}

.glance-item:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
}

.glance-label{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:6px;
}

.glance-value{
    font-size:15px;
    font-weight:850;
}

/* ================= LEADERSHIP ================= */

.leadership-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.leadership-card{
    padding:25px;
    border:1px solid var(--line);
    border-radius:15px;
    background:var(--surface);
    transition:.35s;
}

.leadership-card:hover{
    transform:translateY(-6px);
    border-color:rgba(54,168,255,.35);
}

.leadership-icon{
    font-size:25px;
    margin-bottom:12px;
}

.leadership-card h3{
    font-size:17px;
    margin-bottom:7px;
}

.leadership-card p{
    font-size:12px;
    color:var(--muted);
}

/* ================= FOOTPRINT ================= */

.footprint-box{
    min-height:480px;
    position:relative;
    overflow:hidden;
    border-radius:25px;
    border:1px solid var(--line);
    background:
        radial-gradient(circle at center,rgba(54,168,255,.07),transparent 50%),
        var(--surface);
}

.footprint-title{
    position:absolute;
    top:25px;
    left:25px;
    color:var(--muted);
    font-size:11px;
}

.india-shape{
    position:absolute;
    width:350px;
    height:410px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(8deg);
    border:2px solid rgba(228,182,93,.18);
    clip-path:polygon(
        47% 0,66% 12%,72% 28%,86% 42%,75% 60%,
        80% 75%,61% 100%,43% 87%,31% 72%,17% 57%,
        27% 38%,21% 22%
    );
}

.pin{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 7px rgba(228,182,93,.10);
    animation:pulse 2.4s infinite;
}

.pin span{
    position:absolute;
    left:20px;
    top:-8px;
    white-space:nowrap;
    color:var(--text);
    font-size:10px;
    font-weight:750;
}

.gujarat{left:25%;top:54%}
.maharashtra{left:38%;top:69%}
.mp{left:49%;top:45%}
.up{left:62%;top:37%}
.delhi{left:61%;top:27%}
.haryana{left:57%;top:22%}
.uk{left:67%;top:16%}
.bihar{left:70%;top:30%}
.jharkhand{left:73%;top:44%}

/* ================= PROJECTS ================= */

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
}

.filter{
    padding:8px 14px;
    border-radius:30px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:.3s;
    font-size:11px;
}

.filter:hover,
.filter.active{
    background:var(--gold);
    color:#111;
    border-color:var(--gold);
}

.project-card{
    position:relative;
    overflow:hidden;
    cursor:pointer;
}

.project-card:after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:-80px;
    top:-80px;
    border-radius:50%;
    background:rgba(228,182,93,.07);
    transition:.45s;
}

.project-card:hover:after{
    transform:scale(2.3);
}

.project-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:12px;
}

.project-tag{
    color:var(--gold);
    font-size:10px;
    letter-spacing:1.7px;
    text-transform:uppercase;
    font-weight:850;
}

.project-arrow{
    color:var(--gold);
    font-size:20px;
}

.project-meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:17px;
}

.project-meta span{
    padding:5px 9px;
    border-radius:5px;
    background:rgba(54,168,255,.07);
    color:var(--muted);
    font-size:10px;
}

/* ================= PROJECT MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:2000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(720px,100%);
    max-height:86vh;
    overflow:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:32px;
    box-shadow:var(--shadow);
    animation:modalIn .35s ease;
    position:relative;
}

.modal-close{
    position:absolute;
    right:18px;
    top:15px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-size:18px;
}

.modal-box h2{
    margin:10px 0 12px;
}

.modal-box p{
    color:var(--muted);
}

.modal-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:22px;
}

.modal-info div{
    padding:13px;
    border:1px solid var(--line);
    border-radius:9px;
}

.modal-info small{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.modal-info strong{
    font-size:13px;
}

/* ================= WHAT I DELIVER ================= */

.delivery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.delivery{
    padding:24px;
    border:1px solid var(--line);
    border-radius:15px;
    background:var(--surface);
    transition:.35s;
}

.delivery:hover{
    transform:translateY(-6px);
    border-color:var(--gold);
}

.delivery-number{
    color:var(--gold);
    font-weight:900;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:10px;
}

.delivery h3{
    font-size:18px;
    margin-bottom:7px;
}

.delivery p{
    color:var(--muted);
    font-size:12px;
}

/* ================= CAREER ================= */

.timeline{
    max-width:900px;
    position:relative;
}

.timeline:before{
    content:"";
    position:absolute;
    left:13px;
    top:0;
    bottom:0;
    width:1px;
    background:linear-gradient(var(--gold),rgba(228,182,93,.03));
}

.timeline-item{
    position:relative;
    padding-left:55px;
    padding-bottom:42px;
}

.timeline-dot{
    position:absolute;
    left:7px;
    top:5px;
    width:14px;
    height:14px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 0 6px rgba(228,182,93,.08);
    transition:.3s;
}

.timeline-item:hover .timeline-dot{
    transform:scale(1.45);
}

.timeline-date{
    color:var(--gold);
    font-size:10px;
    font-weight:850;
    letter-spacing:1.4px;
    margin-bottom:6px;
}

/* ================= CAPABILITY ================= */

.capability{
    margin-bottom:20px;
}

.capability-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:8px;
}

.capability-head span:last-child{
    color:var(--gold);
}

.bar{
    height:7px;
    background:rgba(255,255,255,.07);
    border-radius:20px;
    overflow:hidden;
}

.bar span{
    display:block;
    height:100%;
    width:var(--value);
    background:linear-gradient(90deg,var(--blue),var(--gold));
    border-radius:20px;
    transform:scaleX(0);
    transform-origin:left;
    transition:1.2s ease;
}

.reveal.show .bar span{
    transform:scaleX(1);
}

/* ================= EXPERTISE ================= */

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.skill{
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.025);
    color:var(--muted);
    font-size:11px;
    transition:.3s;
}

.skill:hover{
    color:var(--text);
    border-color:var(--gold);
    transform:translateY(-4px);
}

/* ================= ACHIEVEMENTS ================= */

.achievement-icon{
    font-size:27px;
    margin-bottom:13px;
}

/* ================= CTA ================= */

.cta{
    padding:58px;
    border-radius:25px;
    border:1px solid rgba(228,182,93,.23);
    background:
        radial-gradient(circle at 85% 20%,rgba(228,182,93,.11),transparent 30%),
        linear-gradient(120deg,rgba(54,168,255,.06),rgba(228,182,93,.04));
}

.cta h2{
    font-size:clamp(30px,4vw,44px);
    line-height:1.1;
    margin-bottom:13px;
}

.cta p{
    max-width:760px;
    color:var(--muted);
    margin-bottom:25px;
}

/* ================= CONTACT ================= */

.contact-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.contact-item{
    padding:22px;
    border:1px solid var(--line);
    border-radius:13px;
    background:rgba(255,255,255,.025);
    transition:.3s;
}

.contact-item:hover{
    transform:translateX(5px);
    border-color:rgba(228,182,93,.30);
}

.contact-label{
    color:var(--muted);
    font-size:10px;
    margin-bottom:4px;
    letter-spacing:1px;
}
